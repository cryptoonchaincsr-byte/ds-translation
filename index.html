  <script>
    const BIN_ID = "6afadd49ac6210605a8b842b"; 
    const MASTER_KEY = "$2a$10$YSUEua/pdNyKyajJ8a3/zO4uAzFTYFo.PKdneP6Kauz551LzzLtVC";
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    const validPasswords = ["Bds8001", "Ht8001", "Bds8002", "Bds8003", "Bds8004", "Bds8005", "Bds8006", "Bds8007", "Bds8008", "Bds8009", "Bds8010", "Bds8011", "Cds8001", "Cds8002", "Cds8003", "Cds8004", "Cds8005", "Cds8006", "Cds8007", "Cds8008", "Cds8009", "Cds8010", "Cds8011", "Dds8001", "Dds8002", "Dds8003", "Dds8004", "Dds8005", "Dds8006","Eds8001", "Eds8002", "Eds8003","Xds8001", "Xds8002", "Tds8001", "Tds8000"];

    function getDeviceToken() {
      let token = localStorage.getItem('ds_device_token');
      if (!token) {
        token = 'dev_' + navigator.hardwareConcurrency + '_' + (screen.width * screen.height) + '_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('ds_device_token', token);
      }
      return token;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedPass = localStorage.getItem('ds_verified_password');
      const savedToken = localStorage.getItem('ds_verified_token');
      const currentDev = getDeviceToken();
      const overlay = document.getElementById('auth-overlay');

      if (savedPass && validPasswords.includes(savedPass) && savedToken === currentDev) {
        overlay.style.display = 'none';
      } else {
        overlay.style.display = 'flex';
      }
    });

    async function verifyPassword() {
      const inputVal = document.getElementById('accessPassword').value.trim();
      const errorMsg = document.getElementById('authErrorMsg');
      const btn = document.getElementById('loginBtn');
      const currentDev = getDeviceToken();

      if (!validPasswords.includes(inputVal)) {
        errorMsg.innerText = "密码错误，请重新输入！";
        errorMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerText = "正在连接云端核验...";
      errorMsg.style.display = 'none';

      try {
        const res = await fetch(`${API_URL}/latest`, {
          headers: { 'X-Master-Key': MASTER_KEY }
        });
        if (!res.ok) throw new Error("云端配置错误或密钥无效");

        const data = await res.json();
        let binds = data.record || {};
        let boundDev = binds[inputVal];

        if (boundDev && boundDev !== currentDev) {
          errorMsg.innerText = "❌ 该密码已在其他电脑上使用，严禁共用！";
          errorMsg.style.display = 'block';
          btn.disabled = false;
          btn.innerText = "确认进入";
          return;
        }

        if (!boundDev) {
          binds[inputVal] = currentDev;
          const updateRes = await fetch(API_URL, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': MASTER_KEY
            },
            body: JSON.stringify(binds)
          });
          if (!updateRes.ok) throw new Error("绑定写入失败");
        }

        localStorage.setItem('ds_verified_password', inputVal);
        localStorage.setItem('ds_verified_token', currentDev);
        document.getElementById('auth-overlay').style.display = 'none';
      } catch (e) {
        errorMsg.innerText = "验证失败：" + e.message + "（请检查网络）";
        errorMsg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = "确认进入";
      }
    }

    document.getElementById('accessPassword').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') verifyPassword();
    });

    // =========================================================================
    // 智能货币排版核心逻辑（保护 USDT / USDC）
    // =========================================================================
    const currencyMap = {
      "美元": "$", "US Dollar": "$", "USD": "$", "dollar": "$", "dollars": "$",
      "人民币": "¥", "CNY": "¥", "RMB": "¥", "Chinese Yuan": "¥",
      "欧元": "€", "EUR": "€", "Euro": "€", "Euros": "€",
      "英镑": "£", "GBP": "£", "British Pound": "£", "Pound": "£",
      "日元": "¥", "JPY": "¥", "Yen": "¥",
      "泰铢": "฿", "THB": "฿", "Baht": "฿",
      "缅甸元": "K", "MMK": "K", "Kyat": "K",
      "老挝基普": "₭", "LAK": "₭", "Kip": "₭",
      "卢布": "₽", "RUB": "₽", "Ruble": "₽",
      "韩元": "₩", "KRW": "₩", "Won": "₩"
    };

    function formatMoneyAndThousand(text) {
      let result = text;
      result = result.replace(/\bUSDT\b/gi, '___KEEP_USDT___');
      result = result.replace(/\bUSDC\b/gi, '___KEEP_USDC___');

      const sortedKeys = Object.keys(currencyMap).sort((a, b) => b.length - a.length);
      for (let key of sortedKeys) {
        const isAscii = /^[A-Za-z\s]+$/.test(key);
        const pattern = isAscii ? `\\b${key}\\b` : key;
        const regex = new RegExp(pattern, 'gi');
        result = result.replace(regex, currencyMap[key]);
      }

      result = result.replace(/___KEEP_USDT___/g, 'USDT');
      result = result.replace(/___KEEP_USDC___/g, 'USDC');

      let lines = result.split('\n');
      lines = lines.map(line => {
        const hasCurrency = /[$¥€£฿K₭₽₩]/.test(line);
        if (!hasCurrency) return line;

        let formattedLine = line.replace(/([$¥€£฿K₭₽₩])\s*(\d+)(\.\d+)?/g, (match, symbol, intPart, decPart) => {
          let formattedInt = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
          return symbol + formattedInt + (decPart || '');
        });

        formattedLine = formattedLine.replace(/(\d+)(\.\d+)?\s*([$¥€£฿K₭₽₩])/g, (match, intPart, decPart, symbol) => {
          let formattedInt = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
          return formattedInt + (decPart || '') + symbol;
        });

        return formattedLine;
      });

      return lines.join('\n');
    }

    // =========================================================================
    // 稳健翻译引擎（自动分段 + 双通道降级 + 明确错误提示）
    // =========================================================================
    function splitTextIntoChunks(text, maxLen = 420) {
      if (text.length <= maxLen) return [text];
      const chunks = [];
      const paragraphs = text.split('\n');
      let current = '';

      for (const para of paragraphs) {
        const candidate = current ? current + '\n' + para : para;
        if (candidate.length <= maxLen) {
          current = candidate;
        } else {
          if (current) {
            chunks.push(current);
            current = '';
          }
          if (para.length <= maxLen) {
            current = para;
          } else {
            for (let i = 0; i < para.length; i += maxLen) {
              chunks.push(para.slice(i, i + maxLen));
            }
          }
        }
      }
      if (current) chunks.push(current);
      return chunks;
    }

    async function fetchWithTimeout(url, timeoutMs = 8000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    async function translateSingleChunk(chunk, sourceLang, targetLang) {
      let src = sourceLang;
      if (src === 'auto') {
        src = /[\u4e00-\u9fa5]/.test(chunk) ? 'zh-CN' : 'auto';
      }

      // 1. 优先尝试 Google gtx 端点
      try {
        const slParam = src === 'auto' ? 'auto' : src;
        const url2 = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(slParam)}&tl=${encodeURIComponent(targetLang)}&dt=t&q=${encodeURIComponent(chunk)}`;
        const res2 = await fetchWithTimeout(url2, 7000);
        if (res2.ok) {
          const data2 = await res2.json();
          let translatedText = "";
          if (Array.isArray(data2) && Array.isArray(data2[0])) {
            data2[0].forEach(item => {
              if (item && item[0]) translatedText += item[0];
            });
          }
          if (translatedText.trim()) {
            return { ok: true, text: translatedText.trim() };
          }
        }
      } catch (e2) {}

      // 2. 备选 MyMemory 接口（注意：MyMemory 要求明确源语言，auto 兜底为 en/zh-CN）
      try {
        let mmSrc = src === 'auto' ? (targetLang === 'zh-CN' ? 'en' : 'zh-CN') : src;
        if (mmSrc === targetLang) {
          mmSrc = targetLang === 'zh-CN' ? 'en' : 'zh-CN';
        }
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=${encodeURIComponent(mmSrc)}|${encodeURIComponent(targetLang)}`;
        const res = await fetchWithTimeout(url, 8000);
        if (res.ok) {
          const data = await res.json();
          const candidate = data?.responseData?.translatedText || "";
          const isLimitOrWarn =
            candidate.includes("QUERY LENGTH LIMIT EXCEEDED") ||
            candidate.includes("DISTINCT LANGUAGES") ||
            candidate.includes("MYMEMORY WARNING");
          if (candidate.trim() && !isLimitOrWarn) {
            return { ok: true, text: candidate.trim() };
          }
        }
      } catch (e) {}

      return { ok: false, text: "" };
    }

    async function translateText(text, sourceLang, targetLang) {
      if (!text.trim()) return { ok: true, text: "" };

      const chunks = splitTextIntoChunks(text, 420);
      const results = [];

      for (const chunk of chunks) {
        const r = await translateSingleChunk(chunk, sourceLang, targetLang);
        if (!r.ok) {
          return {
            ok: false,
            text: "[翻译失败：当前网络或免费翻译接口繁忙/限流，请稍后重试]"
          };
        }
        results.push(r.text);
      }

      return {
        ok: true,
        text: formatMoneyAndThousand(results.join('\n'))
      };
    }

    function renderOutput(outputId, tooltipId, text, originalText) {
      const outputDiv = document.getElementById(outputId);
      outputDiv.innerHTML = '';

      const textSpan = document.createElement('span');
      textSpan.className = 'result-text';
      textSpan.textContent = text;

      const tipSpan = document.createElement('span');
      tipSpan.id = tooltipId;
      tipSpan.className = 'custom-tooltip';
      tipSpan.textContent = originalText ? ("Original Text:\n" + originalText) : "No original text";

      outputDiv.appendChild(textSpan);
      outputDiv.appendChild(tipSpan);
    }

    let timerLeft = null;
    let timerRight = null;
    let seqLeft = 0;
    let seqRight = 0;

    async function translateLeftToRight() {
      const currentSeq = ++seqLeft;
      const text = document.getElementById('inputLeft').value;
      const sourceLang = document.getElementById('sourceLangLeft').value;
      const targetLang = document.getElementById('targetLangLeft').value;

      if (!text.trim()) {
        renderOutput('outputLeft', 'tooltipLeft', 'Waiting for input...', '');
        return;
      }

      renderOutput('outputLeft', 'tooltipLeft', 'Translating...', text);
      const res = await translateText(text, sourceLang, targetLang);
      if (currentSeq !== seqLeft) return; // 丢弃过期请求结果

      renderOutput('outputLeft', 'tooltipLeft', res.text, text);
    }

    async function translateRightToLeft() {
      const currentSeq = ++seqRight;
      const text = document.getElementById('inputRight').value;
      const sourceLang = document.getElementById('sourceLangRight').value;
      const targetLang = document.getElementById('targetLangRight').value;

      if (!text.trim()) {
        renderOutput('outputRight', 'tooltipRight', 'Waiting for input...', '');
        return;
      }

      renderOutput('outputRight', 'tooltipRight', 'Translating...', text);
      const res = await translateText(text, sourceLang, targetLang);
      if (currentSeq !== seqRight) return; // 丢弃过期请求结果

      renderOutput('outputRight', 'tooltipRight', res.text, text);
    }

    function clearContent(inputId, outputId, tooltipId) {
      if (inputId === 'inputLeft') seqLeft++;
      if (inputId === 'inputRight') seqRight++;
      document.getElementById(inputId).value = "";
      renderOutput(outputId, tooltipId, 'Waiting for input...', '');
    }

    function copyText(outputId, btnId) {
      const outputDiv = document.getElementById(outputId);
      const textEl = outputDiv.querySelector('.result-text');
      const outputText = textEl ? textEl.textContent.trim() : "";
      const copyBtn = document.getElementById(btnId);

      if (
        !outputText ||
        outputText.includes("Waiting for input") ||
        outputText.includes("Translating") ||
        outputText.startsWith("[翻译失败")
      ) return;

      navigator.clipboard.writeText(outputText).then(() => {
        copyBtn.innerText = "Copied!";
        copyBtn.classList.add("copied");
        setTimeout(() => {
          copyBtn.innerText = "Copy";
          copyBtn.classList.remove("copied");
        }, 1500);
      });
    }

    document.getElementById('inputLeft').addEventListener('input', () => {
      clearTimeout(timerLeft);
      timerLeft = setTimeout(translateLeftToRight, 800);
    });

    document.getElementById('inputRight').addEventListener('input', () => {
      clearTimeout(timerRight);
      timerRight = setTimeout(translateRightToLeft, 800);
    });
  </script>
</body>
</html>
